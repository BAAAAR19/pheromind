name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke-test the CLI
        run: |
          python -m pheromind list
          python -m pheromind bench --random --trials 2 --steps 80
          python -m pheromind train --generations 2 --population 6 --worlds 1 \
            --steps 80 --ants 10 --out /tmp/ci-champion.json
          python -m pheromind bench --genome /tmp/ci-champion.json --trials 2 --steps 80
